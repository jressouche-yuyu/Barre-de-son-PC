<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Razer Leviathan V2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/><stop offset="1" stop-color="#161c2b"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5d5d"/><stop offset="0.35" stop-color="#ffd35d"/>
      <stop offset="0.6" stop-color="#5dff9e"/><stop offset="0.8" stop-color="#5db5ff"/>
      <stop offset="1" stop-color="#b15dff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="120" r="240" fill="#44D62C" opacity="0.10"/>
  <!-- barre -->
  <rect x="120" y="250" width="560" height="60" rx="14" fill="#1a2030" stroke="#44D62C" stroke-width="3"/>
  <circle cx="200" cy="280" r="20" fill="#0b0e14" stroke="#44D62C" stroke-width="2"/>
  <circle cx="600" cy="280" r="20" fill="#0b0e14" stroke="#44D62C" stroke-width="2"/>
  <rect x="120" y="300" width="560" height="10" rx="5" fill="url(#rgb)"/>
  <rect x="600" y="330" width="120" height="120" rx="14" fill="#1a2030" stroke="#44D62C" stroke-width="3"/><circle cx="660" cy="390" r="34" fill="#0b0e14" stroke="#44D62C" stroke-width="3"/>
  <text x="60" y="90" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#44D62C">RAZER</text>
  <text x="60" y="150" font-family="system-ui, sans-serif" font-size="46" font-weight="800" fill="#e8ecf4">Leviathan V2</text>
  <text x="60" y="470" font-family="system-ui, sans-serif" font-size="18" fill="#9aa6c0">Visuel indicatif — remplacer par une photo officielle</text>
