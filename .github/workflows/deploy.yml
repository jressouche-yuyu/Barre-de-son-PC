name: Déploiement GitHub Pages

# Construit le site Astro et le publie sur GitHub Pages à chaque push.
# Sur un dépôt public, l'étape « Setup Pages » active Pages automatiquement.

on:
  push:
    branches:
      - main
  # Reconstruction programmée, tous les lundis à 4 h UTC.
  #
  # Ce n'est pas un doublon du déclencheur ci-dessus : plusieurs règles du site
  # dépendent de la date du build, pas du contenu du dépôt. La péremption des
  # fourchettes de prix (45 jours, src/lib/prix.ts) en est l'exemple central —
  # elle est évaluée au rendu, donc elle ne s'arme jamais si plus rien ne
  # reconstruit. Sans ce cron, une machinerie éditoriale en panne ferait servir
  # indéfiniment une donnée commerciale que le site ne peut plus garantir : le
  # filet de sécurité dépendrait de ce qu'il est censé rattraper.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://barre-de-son-pc.fr
          BASE_PATH: /

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
