name: Déploiement GitHub Pages

# Construit le site Astro et le publie sur GitHub Pages à chaque push.
# Prérequis côté dépôt : Settings → Pages → Source = « GitHub Actions ».
# (Dépôt privé : nécessite GitHub Pro, ou rendre le dépôt public.)

on:
  push:
    branches:
      - claude/soundbar-ranking-site-uwpfvi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # URL et sous-chemin pour GitHub Pages (projet).
          SITE_URL: https://jressouche-yuyu.github.io
          BASE_PATH: /Barre-de-son-PC

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
